# Postal admin UI — postal.emails.cheap
# ENABLE ONLY AFTER: A record postal->84.247.139.105 exists AND a TLS cert is issued.
# Steps: cp to /etc/nginx/sites-available/, get cert (certbot --nginx -d postal.emails.cheap),
#        ln -s to sites-enabled, nginx -t && systemctl reload nginx.
server {
    listen 80;
    server_name postal.emails.cheap;
    # certbot will add 443 + cert lines here on issue.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;                 # passes Postal's Rails host guard
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
