function safeGetLang(){try{return localStorage.getItem('tn-lang')||'ru'}catch(e){return 'ru'}}
function safeSetLang(lang){try{localStorage.setItem('tn-lang',lang)}catch(e){}}
function apply(lang){const d=T[lang]||T.ru;document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>{const v=d[el.dataset.i]??'';if(el.tagName==='H1')el.innerHTML=v;else el.textContent=v});document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));safeSetLang(lang)}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.lang)));apply(safeGetLang());
</script>
</body></html>
